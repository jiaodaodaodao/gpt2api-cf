name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Generate CI Wrangler config
        env:
          CF_USER_WEB_ORIGIN: ${{ secrets.CF_USER_WEB_ORIGIN }}
          CF_ADMIN_WEB_ORIGIN: ${{ secrets.CF_ADMIN_WEB_ORIGIN }}
          CF_USER_API_ORIGIN: ${{ secrets.CF_USER_API_ORIGIN }}
          CF_ADMIN_API_ORIGIN: ${{ secrets.CF_ADMIN_API_ORIGIN }}
          CF_OPENAI_API_ORIGIN: ${{ secrets.CF_OPENAI_API_ORIGIN }}
          CF_ADMIN_HOST: ${{ secrets.CF_ADMIN_HOST }}
          CF_CORS_ALLOW_ORIGINS: ${{ secrets.CF_CORS_ALLOW_ORIGINS }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          required = {
              "USER_WEB_ORIGIN": os.environ.get("CF_USER_WEB_ORIGIN", ""),
              "ADMIN_WEB_ORIGIN": os.environ.get("CF_ADMIN_WEB_ORIGIN", ""),
              "USER_API_ORIGIN": os.environ.get("CF_USER_API_ORIGIN", ""),
              "ADMIN_API_ORIGIN": os.environ.get("CF_ADMIN_API_ORIGIN", ""),
              "OPENAI_API_ORIGIN": os.environ.get("CF_OPENAI_API_ORIGIN", ""),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit(f"Missing required origin secrets: {', '.join(missing)}")

          values = {
              **required,
              "ADMIN_HOST": os.environ.get("CF_ADMIN_HOST", ""),
              "CORS_ALLOW_ORIGINS": os.environ.get("CF_CORS_ALLOW_ORIGINS", "*") or "*",
              "BUILD_SHA": os.environ.get("GITHUB_SHA", "dev") or "dev",
          }

          text = Path("wrangler.toml").read_text(encoding="utf-8")
          for key, value in values.items():
              escaped = value.replace('\\', '\\\\').replace('"', '\\"')
              pattern = rf'(?m)^{key}\s*=\s*"[^"]*"\s*$'
              replacement = f'{key} = "{escaped}"'
              text, count = re.subn(pattern, replacement, text)
              if count == 0:
                  raise SystemExit(f"wrangler.toml missing var: {key}")

          Path("wrangler.ci.toml").write_text(text, encoding="utf-8")
          print("Generated wrangler.ci.toml")
          PY

      - name: Dry-run Worker deploy
        run: npx wrangler deploy --dry-run --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
